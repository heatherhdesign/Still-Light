name: Playwright Test

on:
  workflow_dispatch:

  schedule:
    - cron: '0 12 */3 * *'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install chromium

      - name: Create Test Script
        run: |
          cat > test.mjs << 'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({
            headless: true
          });

          const page = await browser.newPage();

          await page.goto(
            'https://still-light.org/gathering.html'
          );

          await page.waitForTimeout(3000);

          console.log('Looking for Step Inside button...');

          await page.getByRole('button', {
            name: /step inside/i
          }).click();

          console.log('Clicked Step Inside');

          await page.waitForTimeout(2000);

          console.log('Looking for Enter Quietly button...');

          await page.getByRole('button', {
          name: /enter quietly/i
          }).click();

          console.log('Clicked Enter Quietly');

          console.log('Waiting in constellation...');

          await page.waitForTimeout(30000);

          console.log('Constellation wait complete.');
          EOF

      - name: Run Test
        run: node test.mjs
